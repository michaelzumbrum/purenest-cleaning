version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fcc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Run schema.sql automatically on first init
      - ./schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # API settings
      DB_DSN: postgresql://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS}
      FROM_EMAIL: ${FROM_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      PARTNER_MAP_PATH: /app/partner_map.json
    volumes:
      - ./partner_map.json:/app/partner_map.json:ro
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
